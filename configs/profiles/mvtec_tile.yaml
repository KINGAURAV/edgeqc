# MVTec AD 'tile': PatchCore-lite, INT8 fused model (normalisation + ResNet-18 + kNN in one ONNX graph).
# Built by scripts/optimize_patchcore.py; thresholds re-calibrated for the INT8 model on the training holdout.
app:
  product: tile
  source: samples/mvtec/tile
vision:
  anomaly:
    method: patchcore
    model_path: models/anomaly/tile/patchcore_fused_int8.onnx
    memory_bank: models/anomaly/tile/memory_bank.npy
    meta: models/anomaly/tile/meta_patchcore_fused_int8.json
    threshold_scale: 0.91   # smoothed image score; test: 100% recall / 9.1% false alarms (0.93: 96.4% / 6.1%)
  classifier:
    enabled: false
severity:
  area_frac: {major: 0.01, critical: 0.05}
# Raspberry Pi 4 (--device configs/devices/pi4.yaml, vision on one core): smaller model for ~2 FPS.
device_overrides:
  pi4:
    vision:
      anomaly:
        model_path: models/anomaly/pi4/tile/patchcore_fused_int8.onnx
        memory_bank: models/anomaly/pi4/tile/memory_bank.npy
        meta: models/anomaly/pi4/tile/meta_patchcore_fused_int8.json
        threshold_scale: 0.93   # 224 px / 2048 patches; smoothed score; test 100% recall / 9.1% false alarms (0.95: 97.6% / 0%)
